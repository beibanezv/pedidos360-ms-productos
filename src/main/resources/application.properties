# Pedidos360 - ms-productos (desarrollo local)
server.port=8081

# Postgres local via docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos360_productos
spring.datasource.username=pedidos360
spring.datasource.password=pedidos360
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Azure AD estilo visto en clase: issuer-uri base + tenant-id (no hardcodear).
# Local: tenant 'common' (sin fetch en startup). Real: define AZURE_TENANT_ID
# con el Directory (tenant) ID del portal.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/
azure.tenant-id=${AZURE_TENANT_ID:common}

# RabbitMQ (cluster local via docker/rabbitmq-cluster/docker-compose.yml de ms-admin).
# En AWS solo cambia RABBITMQ_HOST por la IP privada de la EC2.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

# Consumidor de stock: ACK manual (el listener confirma cada mensaje con
# basicAck/basicNack). Prefetch 1 = fair dispatch, un mensaje a la vez.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
