# Pedidos360 - ms-productos (desarrollo local)
server.port=8081

# Postgres local via docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos360_productos
spring.datasource.username=pedidos360
spring.datasource.password=pedidos360
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Azure AD - issuer-uri (no hardcodear). Define AZURE_TENANT_JWKS_URI en tu .env local.
# Ej: https://login.microsoftonline.com/${TENANT_ID}/v2.0
# Si no esta definida, SecurityConfig usa issuer dummy para que GET publicos funcionen en local.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_TENANT_JWKS_URI:https://login.microsoftonline.com/common/v2.0}
