# Pedidos360 - ms-productos (desarrollo local)
server.port=8081

# Postgres local via docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos360_productos
spring.datasource.username=pedidos360
spring.datasource.password=pedidos360
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Azure AD estilo visto en clase: issuer-uri base + tenant-id (no hardcodear).
# Local: tenant 'common' (sin fetch en startup). Real: define AZURE_TENANT_ID
# con el Directory (tenant) ID del portal.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/
azure.tenant-id=${AZURE_TENANT_ID:common}
