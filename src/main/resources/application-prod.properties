# Pedidos360 - ms-productos (produccion / RDS) - PLACEHOLDERS, sin valores reales
# Activa con: --spring.profiles.active=prod  o  SPRING_PROFILES_ACTIVE=prod
# Reemplaza cada placeholder por variables de entorno en EC2 / RDS.

server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://__RDS_ENDPOINT__:5432/__RDS_DB_NAME__}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:__RDS_USERNAME__}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:__RDS_PASSWORD__}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Azure AD estilo visto en clase - obligatorio en prod: exporta AZURE_TENANT_ID
# con el Directory (tenant) ID real (jwks v1 = issuer-uri + tenant-id + /discovery/keys,
# porque el access token real es ver 1.0 con iss sts.windows.net/<tid>/).
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/
azure.tenant-id=${AZURE_TENANT_ID}
# Orígenes CORS coma-separados (en EC2: la URL https del frontend vía Gateway).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
