# Pedidos360 - ms-productos (produccion / RDS) - PLACEHOLDERS, sin valores reales
# Activa con: --spring.profiles.active=prod  o  SPRING_PROFILES_ACTIVE=prod
# Reemplaza cada placeholder por variables de entorno en EC2 / RDS.

server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://__RDS_ENDPOINT__:5432/__RDS_DB_NAME__}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:__RDS_USERNAME__}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:__RDS_PASSWORD__}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Azure AD - obligatorio en prod: exporta AZURE_TENANT_JWKS_URI con tu tenant real
# Ej: https://login.microsoftonline.com/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx/v2.0
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_TENANT_JWKS_URI}
